<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>My Money</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
  /* Layout: one quiet column. Summary first, then accounts, the entry form, and the month's detail. */
  :root {
    --bg: #f5f5f3;
    --surface: #ffffff;
    --fg: #22262a;
    --muted: #767c80;
    --line: #e7e7e4;
    --soft: #f0f0ed;
    --accent: #46625c;
    --accent-fg: #ffffff;
    --spend: #a8644f;
    --income: #557a62;
    --asb: #94783f;
    --danger: #a5463b;
    --font: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    /* Chart categorical slots (validated reference order); "Other" is neutral grey */
    --c1: #2a78d6; --c2: #eb6834; --c3: #1baf7a; --c4: #eda100;
    --c5: #e87ba4; --c6: #008300; --c7: #6250d6; --c8: #e34948; --c-other: #9a9a94;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --c1: #3987e5; --c2: #d95926; --c3: #199e70; --c4: #c98500;
      --c5: #d55181; --c6: #0ca30c; --c7: #9085e9; --c8: #e66767; --c-other: #6f6f6a;
    }
  }
  :root[data-theme="dark"] {
    --c1: #3987e5; --c2: #d95926; --c3: #199e70; --c4: #c98500;
    --c5: #d55181; --c6: #0ca30c; --c7: #9085e9; --c8: #e66767; --c-other: #6f6f6a;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #141615; --surface: #1b1e1d; --fg: #e4e6e5; --muted: #8d9391; --line: #2a2e2d; --soft: #222624;
      --accent: #8fb0a8; --accent-fg: #121514; --spend: #d39a85; --income: #93bb9f; --asb: #cdb27a; --danger: #e08b80;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #141615; --surface: #1b1e1d; --fg: #e4e6e5; --muted: #8d9391; --line: #2a2e2d; --soft: #222624;
    --accent: #8fb0a8; --accent-fg: #121514; --spend: #d39a85; --income: #93bb9f; --asb: #cdb27a; --danger: #e08b80;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--fg);
    font-family: var(--font); font-size: 15px; line-height: 1.5;
    padding-block: 28px 56px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 540px; margin: 0 auto; display: grid; gap: 28px; }
  .num { font-variant-numeric: tabular-nums; }
  h1, h2 { margin: 0; font-weight: 600; text-wrap: balance; letter-spacing: -.01em; }
  h1 { font-size: 1.25rem; }
  h2 { font-size: .95rem; }
  .label { font-size: .7rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 500; }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  header.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .month { display: flex; align-items: center; gap: 2px; color: var(--muted); }
  .month span { min-width: 112px; text-align: center; font-weight: 500; color: var(--fg); font-size: .9rem; }
  .icon-btn { border: 0; background: transparent; border-radius: 8px; width: 32px; height: 32px; font-size: 1.15rem; line-height: 1; color: var(--muted); }
  .icon-btn:hover:not(:disabled) { background: var(--soft); color: var(--fg); }
  .icon-btn:disabled { opacity: .3; cursor: default; }

  .notice { font-size: .82rem; color: var(--muted); margin: -12px 0 0; }

  /* Summary */
  .summary { display: grid; gap: 22px; }
  .total { font-size: 2.4rem; font-weight: 600; letter-spacing: -.02em; line-height: 1.1; overflow-wrap: anywhere; margin-top: 4px; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .stat { background: var(--surface); padding: 12px 14px; display: grid; gap: 2px; min-width: 0; }
  .stat .value { font-weight: 600; overflow-wrap: anywhere; }
  .stat .value.spend { color: var(--spend); }
  .stat .value.income { color: var(--income); }
  .stat .value.asb { color: var(--asb); }

  section.block { display: grid; gap: 12px; min-width: 0; }
  .head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
  .btn { border: 0; border-radius: 9px; padding: 9px 14px; background: var(--accent); color: var(--accent-fg); font-weight: 500; font-size: .9rem; }
  .btn.ghost { background: transparent; color: var(--accent); padding: 6px 8px; }
  .btn.ghost:hover { background: var(--soft); }
  .btn.quiet { background: var(--soft); color: var(--fg); }
  .btn.danger { background: transparent; color: var(--danger); padding-inline: 4px; }
  .btn:disabled { opacity: .4; cursor: default; }

  /* Accounts */
  .accounts { display: grid; }
  .account {
    display: flex; align-items: center; gap: 12px; width: 100%; text-align: left;
    border: 0; border-bottom: 1px solid var(--line); background: transparent; padding: 13px 14px;
  }
  .account:last-child { border-bottom: 0; }
  .account:hover { background: var(--soft); }
  .account:first-child { border-radius: 12px 12px 0 0; }
  .account:last-child { border-radius: 0 0 12px 12px; }
  .account:only-child { border-radius: 12px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); flex: none; }
  .account.asb .dot { background: var(--asb); }
  .account .name { flex: 1; min-width: 0; }
  .account .name strong { display: block; font-weight: 500; overflow-wrap: anywhere; }
  .account .name small { color: var(--muted); font-size: .78rem; }
  .account .bal { font-weight: 600; text-align: right; }
  .account .bal.neg { color: var(--danger); }
  .empty { color: var(--muted); text-align: center; padding: 20px 14px; display: grid; gap: 12px; justify-items: center; font-size: .9rem; }
  .row-btns { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }

  /* Form */
  form.entry { display: grid; gap: 12px; padding: 14px; }
  .seg { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--soft); border-radius: 9px; padding: 3px; gap: 2px; }
  .seg label { text-align: center; padding: 7px 4px; border-radius: 7px; cursor: pointer; font-size: .88rem; color: var(--muted); font-weight: 500; }
  .seg input { position: absolute; opacity: 0; pointer-events: none; }
  .seg label:has(input:checked) { background: var(--surface); color: var(--fg); box-shadow: 0 1px 2px rgb(0 0 0 / .08); }
  .seg label:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: 1px; }
  .field { display: grid; gap: 4px; min-width: 0; }
  .field label { font-size: .78rem; color: var(--muted); }
  .field input, .field select {
    width: 100%; font-size: 16px; padding: 9px 11px;
    border: 1px solid var(--line); border-radius: 9px; background: var(--bg);
  }
  .pair { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .err { color: var(--danger); font-size: .82rem; min-height: 1.1em; margin: -4px 0; }

  /* Spending donut */
  .donut-card { padding: 16px 14px; display: grid; gap: 16px; }
  .mtabs { display: flex; justify-content: center; gap: 22px; }
  .mtabs button { border: 0; background: transparent; padding: 4px 2px; font-size: .78rem; font-weight: 600; letter-spacing: .08em; color: var(--muted); opacity: .6; border-bottom: 2px solid transparent; }
  .mtabs button.on { color: var(--fg); opacity: 1; border-bottom-color: var(--fg); }
  .mtabs button:disabled { opacity: .25; cursor: default; }
  .donut { position: relative; width: min(240px, 100%); aspect-ratio: 1; max-width: 100%; margin: 0 auto; }
  .donut svg { width: 100%; height: 100%; display: block; transform: rotate(-90deg); }
  .donut circle.seg { fill: none; stroke-width: 26; cursor: pointer; transition: stroke-width .15s; }
  .donut circle.seg.dim { opacity: .3; }
  .donut circle.seg.on { stroke-width: 32; }
  .donut circle.track { fill: none; stroke: var(--soft); stroke-width: 26; }
  .donut .centre { position: absolute; inset: 22%; display: grid; place-content: center; text-align: center; gap: 2px; pointer-events: none; }
  .donut .centre small { color: var(--muted); font-size: .78rem; overflow-wrap: anywhere; }
  .donut .centre strong { font-size: 1.35rem; font-weight: 600; letter-spacing: -.01em; overflow-wrap: anywhere; }
  .donut .centre span { color: var(--muted); font-size: .78rem; }
  .legend { display: grid; }
  .leg { display: grid; grid-template-columns: 10px minmax(0, 1fr) auto 44px; align-items: center; gap: 10px; padding: 9px 4px; border: 0; border-top: 1px solid var(--line); background: transparent; text-align: left; width: 100%; font-size: .88rem; border-radius: 0; }
  .leg:hover, .leg.on { background: var(--soft); }
  .leg i { width: 10px; height: 10px; border-radius: 3px; }
  .leg .pct { color: var(--muted); text-align: right; font-size: .8rem; }
  @media (prefers-reduced-motion: reduce) { .donut circle.seg { transition: none; } }

  /* Transactions */
  .txs { display: grid; padding: 0 14px; }
  .tx { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; align-items: center; gap: 4px 8px; padding: 11px 0; border-bottom: 1px solid var(--line); }
  .tx:last-child { border-bottom: 0; }
  .tx .what { min-width: 0; }
  .tx .what strong { display: block; font-weight: 500; overflow-wrap: anywhere; }
  .tx .what small { color: var(--muted); font-size: .78rem; }
  .tx .amt { font-weight: 500; text-align: right; }
  .tx .amt.belanja { color: var(--spend); }
  .tx .amt.masuk { color: var(--income); }
  .tx .amt.pindah { color: var(--muted); }
  .tx .del { border: 0; background: transparent; color: var(--muted); padding: 6px; border-radius: 6px; font-size: .85rem; opacity: .6; }
  .tx .del:hover { opacity: 1; background: var(--soft); }
  .tx .del.confirm { color: var(--danger); opacity: 1; font-size: .78rem; font-weight: 600; }

  /* Account sheet */
  .scrim { position: fixed; inset: 0; background: rgb(0 0 0 / .35); display: grid; place-items: end center; z-index: 20;
    padding: 16px max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
  .sheet { background: var(--surface); border-radius: 14px; padding: 18px; width: 100%; max-width: 440px; display: grid; gap: 12px; max-height: 100%; overflow: auto; }
  @media (min-width: 640px) { .scrim { place-items: center; } }
  .sheet .actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .sheet .actions .right { display: flex; gap: 8px; margin-left: auto; }
  .sheet .seg { grid-template-columns: repeat(2, 1fr); }

  .toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); background: var(--fg); color: var(--bg); padding: 9px 16px; border-radius: 9px; font-size: .86rem; z-index: 30; max-width: calc(100% - 32px); }
  @media (prefers-reduced-motion: no-preference) { .toast { animation: rise .2s ease-out; } @keyframes rise { from { transform: translate(-50%, 6px); opacity: 0; } } }
</style>

<div class="wrap">
  <header class="top">
    <h1>My Money</h1>
    <div class="month" aria-label="Choose month">
      <button class="icon-btn" id="prevMonth" type="button" aria-label="Previous month">‹</button>
      <span id="monthLabel"></span>
      <button class="icon-btn" id="nextMonth" type="button" aria-label="Next month">›</button>
    </div>
  </header>

  <p class="notice" id="notice">Loading your data…</p>

  <div class="summary">
    <div>
      <div class="label">Total money</div>
      <div class="total num" id="sTotal">RM 0.00</div>
    </div>
    <div class="stats">
      <div class="stat"><span class="label">In banks</span><span class="value num" id="sBank">RM 0.00</span></div>
      <div class="stat"><span class="label">ASB savings</span><span class="value num asb" id="sAsb">RM 0.00</span></div>
      <div class="stat"><span class="label" id="lSpent">Spent this month</span><span class="value num spend" id="sSpent">RM 0.00</span></div>
      <div class="stat"><span class="label">Income</span><span class="value num income" id="sIncome">RM 0.00</span></div>
      <div class="stat"><span class="label">Saved to ASB</span><span class="value num" id="sSaved">RM 0.00</span></div>
    </div>
  </div>

  <section class="block">
    <div class="head">
      <h2>Accounts</h2>
      <button class="btn ghost" id="addAccount" type="button">+ Add account</button>
    </div>
    <div class="card accounts" id="accountList"></div>
  </section>

  <section class="block">
    <h2>New transaction</h2>
    <form class="card entry" id="txForm" novalidate>
      <div class="seg" role="radiogroup" aria-label="Transaction type">
        <label><input type="radio" name="txType" value="belanja" checked><span>Expense</span></label>
        <label><input type="radio" name="txType" value="masuk"><span>Income</span></label>
        <label><input type="radio" name="txType" value="pindah"><span>Transfer</span></label>
      </div>
      <div class="pair">
        <div class="field">
          <label for="txAmount">Amount (RM)</label>
          <input id="txAmount" type="text" inputmode="decimal" placeholder="0.00" autocomplete="off">
        </div>
        <div class="field">
          <label for="txDate">Date</label>
          <input id="txDate" type="date">
        </div>
      </div>
      <div class="pair">
        <div class="field">
          <label for="txAccount" id="lblAccount">From account</label>
          <select id="txAccount"></select>
        </div>
        <div class="field" id="fieldTo" hidden>
          <label for="txTo">To account</label>
          <select id="txTo"></select>
        </div>
        <div class="field" id="fieldCat">
          <label for="txCat">Category</label>
          <select id="txCat"></select>
        </div>
      </div>
      <div class="field">
        <label for="txNote">Note (optional)</label>
        <input id="txNote" type="text" maxlength="80" placeholder="e.g. lunch" autocomplete="off">
      </div>
      <div class="err" id="txErr" role="alert"></div>
      <button class="btn" id="txSave" type="submit">Save transaction</button>
    </form>
  </section>

  <section class="block">
    <h2>Spending by category</h2>
    <div class="card donut-card">
      <div class="mtabs" id="mtabs"></div>
      <div class="donut">
        <svg viewBox="0 0 200 200" id="donutSvg" role="img" aria-label="Spending by category"></svg>
        <div class="centre" id="donutCentre"></div>
      </div>
      <div class="legend" id="catList"></div>
    </div>
  </section>

  <section class="block">
    <h2 id="txTitle">This month</h2>
    <div class="card txs" id="txList"></div>
  </section>
</div>

<div class="scrim" id="scrim" hidden>
  <form class="sheet" id="accountForm" novalidate>
    <h2 id="accTitle">Add account</h2>
    <div class="seg" role="radiogroup" aria-label="Account type">
      <label><input type="radio" name="accType" value="bank" checked><span>Bank / e-wallet</span></label>
      <label><input type="radio" name="accType" value="asb"><span>ASB</span></label>
    </div>
    <div class="field">
      <label for="accName">Account name</label>
      <input id="accName" type="text" list="bankList" maxlength="40" placeholder="e.g. Maybank" autocomplete="off">
      <datalist id="bankList">
        <option value="Maybank"><option value="CIMB"><option value="Bank Islam"><option value="RHB">
        <option value="Public Bank"><option value="Hong Leong"><option value="AmBank"><option value="BSN">
        <option value="Bank Rakyat"><option value="Affin Bank"><option value="GXBank"><option value="Touch 'n Go eWallet">
        <option value="ASB"><option value="ASB 2">
      </datalist>
    </div>
    <div class="field">
      <label for="accBal" id="lblBal">Current balance (RM)</label>
      <input id="accBal" type="text" inputmode="decimal" placeholder="0.00" autocomplete="off">
    </div>
    <div class="err" id="accErr" role="alert"></div>
    <div class="actions">
      <button class="btn danger" id="accDelete" type="button" hidden>Delete account</button>
      <div class="right">
        <button class="btn quiet" id="accCancel" type="button">Cancel</button>
        <button class="btn" type="submit">Save</button>
      </div>
    </div>
  </form>
</div>

<div class="toast" id="toast" hidden></div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const CATEGORIES = ['Food & drinks', 'Transport & fuel', 'Bills & utilities', 'Groceries', 'Rent / loan', 'Shopping', 'Entertainment', 'Health', 'Other'];
  // Categories saved by the earlier Malay version, shown in English
  const OLD_CAT = { 'Makanan & minuman': 'Food & drinks', 'Pengangkutan & minyak': 'Transport & fuel', 'Bil & utiliti': 'Bills & utilities', 'Barang dapur': 'Groceries', 'Sewa / ansuran': 'Rent / loan', 'Belanja peribadi': 'Shopping', 'Hiburan': 'Entertainment', 'Kesihatan': 'Health', 'Lain-lain': 'Other' };
  const catName = (c) => OLD_CAT[c] || c || 'Other';
  const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  const rm = new Intl.NumberFormat('en-MY', { style: 'currency', currency: 'MYR' });
  const fmt = (sen) => rm.format((sen || 0) / 100);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));

  // "12.50" or "1,200" -> sen (integer); null when invalid
  function toSen(text, allowNeg) {
    const t = String(text).replace(/[,\sRMrm]/g, '');
    if (!/^-?\d+(\.\d{0,2})?$/.test(t)) return null;
    const n = Math.round(parseFloat(t) * 100);
    if (!allowNeg && n < 0) return null;
    return n;
  }
  function today() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  }

  // Stored field names stay as before (akaun, transaksi, jumlah…) so existing data keeps working.
  const state = { akaun: [], transaksi: [], month: today().slice(0, 7), mode: 'loading', confirmTx: null };
  let api = null;

  function setupDb(db, uid) {
    const base = db.doc(`data/users/${uid}/kewangan`);
    const cols = { akaun: base.collection('akaun'), transaksi: base.collection('transaksi') };
    const ready = { akaun: false, transaksi: false };
    const timer = setTimeout(() => {
      if (!(ready.akaun && ready.transaksi)) notice("Can't reach your data yet. Check your internet connection.");
    }, 10000);
    for (const name of ['akaun', 'transaksi']) {
      cols[name].onSnapshot((snap) => {
        state[name] = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        if (!snap.metadata.fromCache) ready[name] = true;
        if (ready.akaun && ready.transaksi) { clearTimeout(timer); notice(null); }
        render();
      }, (e) => {
        clearTimeout(timer);
        notice(e.code === 'revoked' ? 'Access to this data was removed.' : "Your data couldn't load. Reload the page to try again.");
      });
    }
    return {
      add: (c, data) => cols[c].add(data),
      update: (c, id, data) => cols[c].doc(id).update(data),
      remove: (c, id) => cols[c].doc(id).delete()
    };
  }

  function setupLocal() {
    const KEY = 'duit-saya-v1';
    try {
      const d = JSON.parse(localStorage.getItem(KEY));
      if (d && Array.isArray(d.akaun)) { state.akaun = d.akaun; state.transaksi = d.transaksi || []; }
    } catch (e) {}
    const save = () => { try { localStorage.setItem(KEY, JSON.stringify({ akaun: state.akaun, transaksi: state.transaksi })); } catch (e) {} render(); };
    const id = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
    return {
      add: async (c, data) => { state[c] = [...state[c], { id: id(), ...data }]; save(); },
      update: async (c, i, data) => { state[c] = state[c].map(x => x.id === i ? { ...x, ...data } : x); save(); },
      remove: async (c, i) => { state[c] = state[c].filter(x => x.id !== i); save(); }
    };
  }

  async function init() {
    render();
    let db = null, user = null;
    try {
      if (window.claude && typeof window.claude.use === 'function') {
        [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
      }
    } catch (e) {}
    let uid = null;
    try { uid = user ? await user.id() : null; } catch (e) {}
    if (db && uid) {
      state.mode = 'db';
      api = setupDb(db, uid);
    } else {
      state.mode = 'local';
      api = setupLocal();
      notice('Saved in this browser only. Sign in to claude.ai to see the same data on every device.');
      render();
    }
  }

  function notice(text) { const n = $('notice'); n.hidden = !text; if (text) n.textContent = text; }
  let toastTimer;
  function toast(text) {
    const t = $('toast'); t.textContent = text; t.hidden = false;
    clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 2400);
  }
  function errText(e) {
    if (e && e.code === 'quota_exceeded') return 'Storage is full. Delete old transactions to add new ones.';
    if (e && e.code === 'invalid_argument') return "You don't have permission to save on this page.";
    return "Couldn't save. Check your connection and try again.";
  }

  // ---------- Calculations ----------
  function net(accId) {
    let n = 0;
    for (const t of state.transaksi) {
      const j = t.jumlah || 0;
      if (t.jenis === 'belanja' && t.akaunId === accId) n -= j;
      else if (t.jenis === 'masuk' && t.akaunId === accId) n += j;
      else if (t.jenis === 'pindah') { if (t.dariId === accId) n -= j; if (t.keId === accId) n += j; }
    }
    return n;
  }
  const balance = (a) => (a.bakiAwal || 0) + net(a.id);
  const accName = (id) => (state.akaun.find(a => a.id === id) || {}).nama || 'Deleted account';
  const sortedAccounts = () => [...state.akaun].sort((a, b) => (a.jenis === b.jenis ? (a.dicipta || 0) - (b.dicipta || 0) : a.jenis === 'asb' ? 1 : -1));

  // ---------- Render ----------
  function render() {
    const [y, m] = state.month.split('-').map(Number);
    const thisMonth = state.month === today().slice(0, 7);
    $('monthLabel').textContent = `${MONTHS[m - 1]} ${y}`;
    $('nextMonth').disabled = state.month >= today().slice(0, 7);
    $('lSpent').textContent = thisMonth ? 'Spent this month' : `Spent in ${MONTHS[m - 1].slice(0, 3)}`;
    $('txTitle').textContent = thisMonth ? 'This month' : `${MONTHS[m - 1]} ${y}`;

    const accounts = sortedAccounts();
    const asbIds = new Set(accounts.filter(a => a.jenis === 'asb').map(a => a.id));
    let bank = 0, asb = 0;
    for (const a of accounts) { if (a.jenis === 'asb') asb += balance(a); else bank += balance(a); }
    const monthTx = state.transaksi.filter(t => (t.tarikh || '').startsWith(state.month));
    let spent = 0, income = 0, saved = 0;
    for (const t of monthTx) {
      if (t.jenis === 'belanja') spent += t.jumlah;
      if (t.jenis === 'masuk') { income += t.jumlah; if (asbIds.has(t.akaunId)) saved += t.jumlah; }
      if (t.jenis === 'pindah' && asbIds.has(t.keId) && !asbIds.has(t.dariId)) saved += t.jumlah;
    }
    $('sTotal').textContent = fmt(bank + asb);
    $('sBank').textContent = fmt(bank);
    $('sAsb').textContent = fmt(asb);
    $('sSpent').textContent = fmt(spent);
    $('sIncome').textContent = fmt(income);
    $('sSaved').textContent = fmt(saved);

    // Accounts
    const list = $('accountList');
    if (state.mode === 'loading') {
      list.innerHTML = '<div class="empty">Loading accounts…</div>';
    } else if (accounts.length === 0) {
      list.innerHTML = `<div class="empty"><span>No accounts yet. Add each bank with its current balance, and an ASB account to track your savings.</span>
        <div class="row-btns"><button class="btn" type="button" data-new="bank">Add bank</button><button class="btn quiet" type="button" data-new="asb">Add ASB</button></div></div>`;
    } else {
      list.innerHTML = accounts.map(a => {
        const b = balance(a);
        return `<button type="button" class="account ${a.jenis === 'asb' ? 'asb' : ''}" data-acc="${esc(a.id)}">
          <span class="dot" aria-hidden="true"></span>
          <span class="name"><strong>${esc(a.nama)}</strong><small>${a.jenis === 'asb' ? 'ASB savings' : 'Bank / e-wallet'}</small></span>
          <span class="bal num ${b < 0 ? 'neg' : ''}">${fmt(b)}</span></button>`;
      }).join('');
    }

    // Account choices in the form
    const opts = accounts.map(a => `<option value="${esc(a.id)}">${esc(a.nama)}</option>`).join('');
    for (const sel of [$('txAccount'), $('txTo')]) {
      const prev = sel.value;
      sel.innerHTML = opts || '<option value="">Add an account first</option>';
      if (accounts.some(a => a.id === prev)) sel.value = prev;
    }
    if ($('txTo').value === $('txAccount').value && accounts.length > 1) {
      const other = accounts.find(a => a.jenis === 'asb' && a.id !== $('txAccount').value) || accounts.find(a => a.id !== $('txAccount').value);
      $('txTo').value = other.id;
    }
    $('txSave').disabled = accounts.length === 0;

    renderDonut(monthTx, spent);

    // Transactions
    const txs = [...monthTx].sort((a, b) => (b.tarikh || '').localeCompare(a.tarikh || '') || (b.dicipta || 0) - (a.dicipta || 0));
    $('txList').innerHTML = txs.length ? txs.map(t => {
      const [ty, tm, td] = (t.tarikh || '').split('-');
      const date = td ? `${Number(td)} ${MONTHS[Number(tm) - 1].slice(0, 3)}` : '';
      let title, detail, sign;
      if (t.jenis === 'pindah') { title = t.nota || 'Transfer'; detail = `${accName(t.dariId)} → ${accName(t.keId)}`; sign = ''; }
      else if (t.jenis === 'masuk') { title = t.nota || 'Income'; detail = accName(t.akaunId); sign = '+'; }
      else { title = t.nota || catName(t.kategori); detail = `${t.nota ? catName(t.kategori) + ' · ' : ''}${accName(t.akaunId)}`; sign = '−'; }
      const confirm = state.confirmTx === t.id;
      return `<div class="tx"><div class="what"><strong>${esc(title)}</strong><small>${esc(date)} · ${esc(detail)}</small></div>
        <div class="amt num ${t.jenis}">${sign}${fmt(t.jumlah)}</div>
        <button type="button" class="del ${confirm ? 'confirm' : ''}" data-del-tx="${esc(t.id)}" aria-label="${confirm ? 'Confirm delete' : 'Delete transaction'}">${confirm ? 'Delete?' : '✕'}</button></div>`;
    }).join('') : `<div class="empty">${state.mode === 'loading' ? 'Loading…' : 'No transactions this month.'}</div>`;
  }

  // ---------- Spending donut ----------
  // Colour follows the category (fixed slot), never its rank. "Other" and unknown categories are grey.
  const catColour = (k) => { const i = CATEGORIES.indexOf(k); return i >= 0 && i < 8 ? `var(--c${i + 1})` : 'var(--c-other)'; };
  let activeCat = null;
  function renderDonut(monthTx, spent) {
    // Month tabs: previous, selected, next
    const [y, m] = state.month.split('-').map(Number);
    const tabs = [-1, 0, 1].map(s => { const d = new Date(y, m - 1 + s, 1); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`; });
    const nowKey = today().slice(0, 7);
    $('mtabs').innerHTML = tabs.map((k, i) => `<button type="button" data-month="${k}" class="${i === 1 ? 'on' : ''}" ${k > nowKey ? 'disabled' : ''}>${MONTHS[Number(k.slice(5)) - 1].slice(0, 3).toUpperCase()}</button>`).join('');

    const byCat = {};
    for (const t of monthTx) if (t.jenis === 'belanja') { const k = catName(t.kategori); byCat[k] = (byCat[k] || 0) + t.jumlah; }
    const cats = Object.entries(byCat).sort((a, b) => b[1] - a[1]);
    if (activeCat && !byCat[activeCat]) activeCat = null;

    const R = 80, C = 2 * Math.PI * R, GAP = cats.length > 1 ? 2 : 0;
    let off = 0, segs = '';
    for (const [k, v] of cats) {
      const len = v / spent * C;
      const draw = Math.max(len - GAP, 0.5);
      const cls = activeCat ? (activeCat === k ? 'seg on' : 'seg dim') : 'seg';
      segs += `<circle class="${cls}" data-cat="${esc(k)}" cx="100" cy="100" r="${R}" stroke="${catColour(k)}" stroke-dasharray="${draw} ${C - draw}" stroke-dashoffset="${-off}"><title>${esc(k)}: ${fmt(v)}</title></circle>`;
      off += len;
    }
    $('donutSvg').innerHTML = `<circle class="track" cx="100" cy="100" r="${R}"></circle>${segs}`;

    const thisMonth = state.month === nowKey;
    if (activeCat) {
      const v = byCat[activeCat];
      $('donutCentre').innerHTML = `<small>${esc(activeCat)}</small><strong class="num">${fmt(v)}</strong><span>${Math.round(v / spent * 100)}% of spending</span>`;
    } else {
      $('donutCentre').innerHTML = `<small>${thisMonth ? "This month's spending" : `Spending in ${MONTHS[m - 1]}`}</small><strong class="num">${fmt(spent)}</strong>`;
    }

    $('catList').innerHTML = cats.length
      ? cats.map(([k, v]) => `<button type="button" class="leg ${activeCat === k ? 'on' : ''}" data-cat="${esc(k)}">
          <i style="background:${catColour(k)}"></i><span>${esc(k)}</span><span class="num">${fmt(v)}</span><span class="pct num">${Math.round(v / spent * 100)}%</span></button>`).join('')
      : '<div class="empty">No spending recorded this month.</div>';
  }
  function pickCat(e) {
    const el = e.target.closest('[data-cat]');
    if (!el) return;
    activeCat = activeCat === el.dataset.cat ? null : el.dataset.cat;
    render();
  }
  $('donutSvg').addEventListener('click', pickCat);
  $('catList').addEventListener('click', pickCat);
  $('mtabs').addEventListener('click', (e) => {
    const b = e.target.closest('[data-month]');
    if (!b || b.disabled) return;
    state.month = b.dataset.month; state.confirmTx = null; activeCat = null;
    render();
  });

  // ---------- Transaction form ----------
  const txType = () => document.querySelector('input[name="txType"]:checked').value;
  function updateForm() {
    const t = txType();
    $('fieldTo').hidden = t !== 'pindah';
    $('fieldCat').hidden = t !== 'belanja';
    $('lblAccount').textContent = t === 'masuk' ? 'To account' : 'From account';
    $('txNote').placeholder = t === 'belanja' ? 'e.g. lunch' : t === 'masuk' ? 'e.g. November salary' : 'e.g. monthly ASB saving';
    $('txErr').textContent = '';
  }
  $('txCat').innerHTML = CATEGORIES.map(c => `<option>${esc(c)}</option>`).join('');
  $('txDate').value = today();
  document.querySelectorAll('input[name="txType"]').forEach(r => r.addEventListener('change', updateForm));

  let saving = false;
  $('txForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    if (saving || !api) return;
    const t = txType();
    const amount = toSen($('txAmount').value);
    const err = $('txErr');
    if (!amount) { err.textContent = 'Enter an amount above RM0, for example 12.50.'; $('txAmount').focus(); return; }
    if (!$('txAccount').value) { err.textContent = 'Add an account before recording a transaction.'; return; }
    if (!$('txDate').value) { err.textContent = 'Pick a date.'; return; }
    const data = { jenis: t, jumlah: amount, tarikh: $('txDate').value, nota: $('txNote').value.trim(), dicipta: Date.now() };
    if (t === 'pindah') {
      if ($('txAccount').value === $('txTo').value) { err.textContent = 'Choose two different accounts for a transfer.'; return; }
      data.dariId = $('txAccount').value; data.keId = $('txTo').value;
    } else {
      data.akaunId = $('txAccount').value;
      if (t === 'belanja') data.kategori = $('txCat').value;
    }
    saving = true; $('txSave').disabled = true;
    try {
      await api.add('transaksi', data);
      $('txAmount').value = ''; $('txNote').value = ''; err.textContent = '';
      state.month = data.tarikh.slice(0, 7);
      toast(t === 'belanja' ? 'Expense saved' : t === 'masuk' ? 'Income saved' : 'Transfer saved');
      render();
    } catch (ex) { err.textContent = errText(ex); }
    finally { saving = false; $('txSave').disabled = state.akaun.length === 0; }
  });

  // ---------- Delete transaction (two taps) ----------
  $('txList').addEventListener('click', async (e) => {
    const btn = e.target.closest('[data-del-tx]');
    if (!btn || !api) return;
    const id = btn.dataset.delTx;
    if (state.confirmTx !== id) { state.confirmTx = id; render(); return; }
    state.confirmTx = null;
    try { await api.remove('transaksi', id); toast('Transaction deleted'); } catch (ex) { toast(errText(ex)); }
    render();
  });

  // ---------- Account sheet ----------
  let editing = null, confirmDel = false;
  function openAccount(id, newType) {
    editing = id ? state.akaun.find(a => a.id === id) : null;
    confirmDel = false;
    $('accTitle').textContent = editing ? 'Edit account' : 'Add account';
    const type = editing ? editing.jenis : (newType || 'bank');
    document.querySelector(`input[name="accType"][value="${type}"]`).checked = true;
    $('accName').value = editing ? editing.nama : (type === 'asb' ? 'ASB' : '');
    $('accBal').value = editing ? (balance(editing) / 100).toFixed(2) : '';
    $('lblBal').textContent = editing ? 'Actual balance now (RM)' : 'Current balance (RM)';
    $('accDelete').hidden = !editing;
    $('accDelete').textContent = 'Delete account';
    $('accErr').textContent = '';
    $('scrim').hidden = false;
    setTimeout(() => $('accName').focus(), 30);
  }
  function closeAccount() { $('scrim').hidden = true; editing = null; }

  $('addAccount').addEventListener('click', () => openAccount(null));
  $('accountList').addEventListener('click', (e) => {
    const a = e.target.closest('[data-acc]'); if (a) return openAccount(a.dataset.acc);
    const b = e.target.closest('[data-new]'); if (b) return openAccount(null, b.dataset.new);
  });
  $('accCancel').addEventListener('click', closeAccount);
  $('scrim').addEventListener('click', (e) => { if (e.target === $('scrim')) closeAccount(); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !$('scrim').hidden) closeAccount(); });
  document.querySelectorAll('input[name="accType"]').forEach(r => r.addEventListener('change', () => {
    if (!editing && r.checked && r.value === 'asb' && !$('accName').value) $('accName').value = 'ASB';
  }));

  $('accountForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    if (!api) return;
    const name = $('accName').value.trim();
    const type = document.querySelector('input[name="accType"]:checked').value;
    const sen = $('accBal').value.trim() === '' ? 0 : toSen($('accBal').value, true);
    if (!name) { $('accErr').textContent = 'Enter an account name, for example Maybank.'; return; }
    if (sen === null) { $('accErr').textContent = 'Balance not valid. Use a number like 1500 or 1500.50.'; return; }
    try {
      if (editing) {
        // Adjust the starting balance so the calculated balance matches the real one entered
        await api.update('akaun', editing.id, { nama: name, jenis: type, bakiAwal: sen - net(editing.id) });
        toast('Account updated');
      } else {
        await api.add('akaun', { nama: name, jenis: type, bakiAwal: sen, dicipta: Date.now() });
        toast(`${name} added`);
      }
      closeAccount();
    } catch (ex) { $('accErr').textContent = errText(ex); }
  });

  $('accDelete').addEventListener('click', async () => {
    if (!editing || !api) return;
    const linked = state.transaksi.filter(t => t.akaunId === editing.id || t.dariId === editing.id || t.keId === editing.id);
    if (!confirmDel) {
      confirmDel = true;
      $('accDelete').textContent = linked.length ? `Confirm: delete with ${linked.length} transaction${linked.length > 1 ? 's' : ''}` : 'Confirm delete';
      return;
    }
    const id = editing.id, name = editing.nama;
    try {
      for (const t of linked) await api.remove('transaksi', t.id);
      await api.remove('akaun', id);
      toast(`${name} deleted`);
      closeAccount();
    } catch (ex) { $('accErr').textContent = errText(ex); }
  });

  // ---------- Month ----------
  function shiftMonth(step) {
    const [y, m] = state.month.split('-').map(Number);
    const d = new Date(y, m - 1 + step, 1);
    state.month = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
    state.confirmTx = null;
    render();
  }
  $('prevMonth').addEventListener('click', () => shiftMonth(-1));
  $('nextMonth').addEventListener('click', () => shiftMonth(1));

  updateForm();
  init();
})();
</script>

</body>
</html>
