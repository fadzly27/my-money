<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<body><title>My Money</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
  /* Layout: iOS-style grouped lists on a light grey ground, one column, floating Add button. Light mode only. */
  :root {
    color-scheme: light;
    --bg: #f2f2f7;
    --card: #ffffff;
    --fg: #1c1c1e;
    --muted: #6c6c70;
    --sep: #e3e3e8;
    --fill: #ececf0;
    --accent: #007aff;
    --income: #248a3d;
    --danger: #d70015;
    --pending: #b25000;
    --asb: #5856d6;
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Segoe UI", system-ui, sans-serif;
    /* Chart categorical slots (validated reference order); "Other" is neutral grey */
    --c1: #2a78d6; --c2: #eb6834; --c3: #1baf7a; --c4: #eda100;
    --c5: #e87ba4; --c6: #008300; --c7: #6250d6; --c8: #e34948; --c-other: #a1a1a6;
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0;
    background: var(--bg); color: var(--fg);
    font-family: var(--font); font-size: 16px; line-height: 1.4;
    padding-block: 12px calc(110px + env(safe-area-inset-bottom, 0px));
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 560px; margin: 0 auto; display: grid; gap: 22px; }
  .num { font-variant-numeric: tabular-nums; }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* Header */
  header.top { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; padding-top: 8px; }
  h1 { margin: 0; font-size: 2.1rem; font-weight: 700; letter-spacing: -.02em; }
  .round { width: 36px; height: 36px; border-radius: 50%; border: 0; background: var(--card); color: var(--accent); display: grid; place-items: center; box-shadow: 0 1px 2px rgb(0 0 0 / .06); }
  .round svg { width: 18px; height: 18px; }
  .status { font-size: .8rem; color: var(--muted); margin: -12px 4px 0; display: flex; align-items: center; gap: 6px; }
  .status.warn { color: var(--pending); }
  .status i { width: 7px; height: 7px; border-radius: 50%; background: currentColor; flex: none; }

  /* Hero */
  .hero { background: var(--card); border-radius: 18px; padding: 18px 18px 16px; display: grid; gap: 4px; }
  .hero-top { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: .9rem; font-weight: 500; }
  .eye { border: 0; background: transparent; color: var(--muted); padding: 4px; border-radius: 8px; display: grid; place-items: center; }
  .eye svg { width: 22px; height: 22px; }
  .total { font-size: 2.3rem; font-weight: 700; letter-spacing: -.02em; line-height: 1.15; overflow-wrap: anywhere; }
  .hero-sub { display: flex; gap: 6px 16px; flex-wrap: wrap; color: var(--muted); font-size: .88rem; }
  .hero-sub b { color: var(--fg); font-weight: 600; }

  /* Grouped lists */
  .group { display: grid; gap: 6px; min-width: 0; }
  .group-title { font-size: .8rem; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); padding: 0 16px; }
  .list { background: var(--card); border-radius: 14px; overflow: hidden; }
  .row { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 50px; padding: 10px 16px; border: 0; background: transparent; text-align: left; position: relative; }
  .row + .row::before { content: ""; position: absolute; top: 0; left: 16px; right: 0; border-top: 1px solid var(--sep); }
  button.row:active { background: var(--fill); }
  .row .main { flex: 1; min-width: 0; }
  .row .main strong { display: block; font-weight: 500; overflow-wrap: anywhere; }
  .row .main small { display: block; color: var(--muted); font-size: .8rem; }
  .row .end { font-weight: 500; text-align: right; white-space: nowrap; }
  .chev { color: #c4c4c7; font-size: 1.2rem; margin-left: -4px; }
  .badge { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; color: #fff; font-size: .72rem; font-weight: 700; flex: none; background: var(--accent); }
  .badge.asb { background: var(--asb); }
  .row.link { color: var(--accent); font-weight: 500; }
  .neg { color: var(--danger); }
  .empty { color: var(--muted); text-align: center; padding: 22px 16px; font-size: .92rem; }

  /* Month */
  .month { display: flex; align-items: center; justify-content: space-between; padding: 0 4px; }
  .month h2 { margin: 0; font-size: 1.3rem; font-weight: 700; letter-spacing: -.01em; }
  .month .arrows { display: flex; gap: 8px; }
  .month .round:disabled { opacity: .35; cursor: default; }

  .trio { background: var(--card); border-radius: 14px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .trio div { padding: 12px 14px; display: grid; gap: 2px; min-width: 0; }
  .trio div + div { border-left: 1px solid var(--sep); }
  .trio small { color: var(--muted); font-size: .76rem; }
  .trio b { font-weight: 600; font-size: .98rem; overflow-wrap: anywhere; }

  /* Donut */
  .chart { background: var(--card); border-radius: 14px; padding: 18px 16px 6px; display: grid; gap: 14px; }
  .donut { position: relative; width: min(230px, 100%); aspect-ratio: 1; max-width: 100%; margin: 0 auto; }
  .donut svg { width: 100%; height: 100%; display: block; transform: rotate(-90deg); }
  .donut circle.seg { fill: none; stroke-width: 24; cursor: pointer; transition: stroke-width .15s, opacity .15s; }
  .donut circle.seg.dim { opacity: .25; }
  .donut circle.seg.on { stroke-width: 30; }
  .donut circle.track { fill: none; stroke: var(--fill); stroke-width: 24; }
  .donut .centre { position: absolute; inset: 22%; display: grid; place-content: center; text-align: center; gap: 2px; pointer-events: none; }
  .donut .centre small { color: var(--muted); font-size: .78rem; overflow-wrap: anywhere; }
  .donut .centre strong { font-size: 1.3rem; font-weight: 700; letter-spacing: -.01em; overflow-wrap: anywhere; }
  .donut .centre span { color: var(--muted); font-size: .76rem; }
  .legend .row { min-height: 44px; padding: 8px 4px; }
  .legend .row + .row::before { left: 4px; }
  .legend .row.on { background: var(--fill); border-radius: 8px; }
  .legend i { width: 10px; height: 10px; border-radius: 3px; flex: none; }
  .legend .pct { color: var(--muted); font-size: .82rem; width: 40px; text-align: right; }

  /* Transactions */
  .tx .end.masuk { color: var(--income); }
  .tx .end.pindah { color: var(--muted); }
  .tx .wait { color: var(--pending); }
  .tx .del { border: 0; background: var(--danger); color: #fff; border-radius: 8px; padding: 6px 12px; font-size: .85rem; font-weight: 600; }

  /* Floating add button */
  .fab { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); z-index: 10;
    border: 0; border-radius: 999px; padding: 14px 26px; background: var(--accent); color: #fff; font-weight: 600; font-size: 1rem;
    box-shadow: 0 6px 20px rgb(0 122 255 / .3); display: flex; align-items: center; gap: 8px; white-space: nowrap; }
  .fab svg { width: 18px; height: 18px; }
  .fab:disabled { opacity: .5; cursor: default; }

  /* Sheets */
  .scrim { position: fixed; inset: 0; background: rgb(0 0 0 / .3); display: grid; place-items: end center; z-index: 20; }
  .sheet { background: var(--bg); width: 100%; max-width: 560px; max-height: 92%; overflow: auto; border-radius: 14px 14px 0 0;
    padding: 0 max(16px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
    display: grid; gap: 18px; align-content: start; }
  @media (min-width: 640px) { .scrim { place-items: center; } .sheet { border-radius: 14px; } }
  @media (prefers-reduced-motion: no-preference) { .sheet { animation: up .22s ease-out; } @keyframes up { from { transform: translateY(24px); opacity: .6; } } }
  .sheet-head { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 14px 0 0; position: sticky; top: 0; background: var(--bg); z-index: 1; }
  .sheet-head h2 { margin: 0; font-size: 1rem; font-weight: 600; text-align: center; }
  .txt-btn { border: 0; background: transparent; color: var(--accent); padding: 6px 0; font-size: 1rem; }
  .txt-btn.save { font-weight: 600; justify-self: end; }
  .txt-btn.cancel { justify-self: start; }
  .seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--fill); border-radius: 9px; padding: 2px; gap: 2px; }
  .seg label { text-align: center; padding: 6px 4px; border-radius: 7px; cursor: pointer; font-size: .88rem; font-weight: 500; }
  .seg input { position: absolute; opacity: 0; pointer-events: none; }
  .seg label:has(input:checked) { background: var(--card); box-shadow: 0 1px 3px rgb(0 0 0 / .12); font-weight: 600; }
  .seg label:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: 1px; }
  .amount { display: grid; justify-items: center; gap: 2px; padding: 6px 0; }
  .amount small { color: var(--muted); font-size: .82rem; }
  .amount input { border: 0; background: transparent; text-align: center; font-size: 2.6rem; font-weight: 700; letter-spacing: -.02em; width: 100%; padding: 0; }
  .amount input::placeholder { color: #c4c4c7; }
  .field { display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 6px 16px; position: relative; }
  .field + .field::before { content: ""; position: absolute; top: 0; left: 16px; right: 0; border-top: 1px solid var(--sep); }
  .field label { flex: none; }
  .field input, .field select { flex: 1; min-width: 0; border: 0; background: transparent; text-align: right; font-size: 16px; color: var(--muted); padding: 6px 0; -webkit-appearance: none; appearance: none; }
  .field select { text-align-last: right; cursor: pointer; }
  .field input:focus, .field select:focus { color: var(--fg); outline: none; }
  .field:focus-within { background: #fafafc; }
  .err { color: var(--danger); font-size: .85rem; text-align: center; min-height: 1.2em; margin: -8px 0; }
  .row.destroy { justify-content: center; color: var(--danger); font-weight: 500; }

  .toast { position: fixed; left: 50%; transform: translateX(-50%); top: calc(14px + env(safe-area-inset-top, 0px)); background: rgb(28 28 30 / .92); color: #fff; padding: 10px 18px; border-radius: 999px; font-size: .88rem; z-index: 30; max-width: calc(100% - 32px); }
  @media (prefers-reduced-motion: no-preference) { .toast { animation: drop .2s ease-out; } @keyframes drop { from { transform: translate(-50%, -8px); opacity: 0; } } }
</style>

<div class="wrap">
  <header class="top">
    <h1>My Money</h1>
    <button class="round" id="headerAdd" type="button" aria-label="Add transaction">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    </button>
  </header>

  <p class="status" id="status" hidden></p>

  <div class="hero">
    <div class="hero-top">
      <span>Total money</span>
      <button class="eye" id="eye" type="button" aria-label="Hide balances" aria-pressed="false"></button>
    </div>
    <div class="total num" id="sTotal">RM 0.00</div>
    <div class="hero-sub"><span>Banks <b class="num" id="sBank">RM 0.00</b></span><span>Investments <b class="num" id="sAsb">RM 0.00</b></span></div>
  </div>

  <section class="group">
    <div class="group-title">Accounts</div>
    <div class="list" id="accountList"></div>
  </section>

  <section class="group">
    <div class="month">
      <h2 id="monthLabel"></h2>
      <div class="arrows">
        <button class="round" id="prevMonth" type="button" aria-label="Previous month">‹</button>
        <button class="round" id="nextMonth" type="button" aria-label="Next month">›</button>
      </div>
    </div>
    <div class="trio">
      <div><small>Spent</small><b class="num" id="sSpent">RM 0.00</b></div>
      <div><small>Income</small><b class="num" id="sIncome" style="color:var(--income)">RM 0.00</b></div>
      <div><small>Investment</small><b class="num" id="sSaved">RM 0.00</b></div>
    </div>
  </section>

  <section class="group">
    <div class="group-title">Spending by category</div>
    <div class="chart">
      <div class="donut">
        <svg viewBox="0 0 200 200" id="donutSvg" role="img" aria-label="Spending by category"></svg>
        <div class="centre" id="donutCentre"></div>
      </div>
      <div class="legend" id="catList"></div>
    </div>
  </section>

  <section class="group">
    <div class="group-title">Transactions</div>
    <div class="list" id="txList"></div>
  </section>
</div>

<button class="fab" id="fab" type="button">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
  Add Transaction
</button>

<!-- Transaction sheet -->
<div class="scrim" id="txScrim" hidden>
  <form class="sheet" id="txForm" novalidate>
    <div class="sheet-head">
      <button class="txt-btn cancel" type="button" data-close="txScrim">Cancel</button>
      <h2>New Transaction</h2>
      <button class="txt-btn save" type="submit" id="txSave">Save</button>
    </div>
    <div class="seg" role="radiogroup" aria-label="Transaction type">
      <label><input type="radio" name="txType" value="belanja" checked><span>Expense</span></label>
      <label><input type="radio" name="txType" value="masuk"><span>Income</span></label>
      <label><input type="radio" name="txType" value="pindah"><span>Transfer</span></label>
    </div>
    <div class="amount">
      <small>Amount (RM)</small>
      <input id="txAmount" type="text" inputmode="decimal" placeholder="0.00" autocomplete="off" aria-label="Amount in ringgit">
    </div>
    <div class="list">
      <div class="field"><label for="txAccount" id="lblAccount">From</label><select id="txAccount"></select></div>
      <div class="field" id="fieldTo" hidden><label for="txTo">To</label><select id="txTo"></select></div>
      <div class="field" id="fieldCat"><label for="txCat">Category</label><select id="txCat"></select></div>
      <div class="field"><label for="txDate">Date</label><input id="txDate" type="date"></div>
      <div class="field"><label for="txNote">Note</label><input id="txNote" type="text" maxlength="80" placeholder="Optional" autocomplete="off"></div>
    </div>
    <div class="err" id="txErr" role="alert"></div>
  </form>
</div>

<!-- Account sheet -->
<div class="scrim" id="accScrim" hidden>
  <form class="sheet" id="accountForm" novalidate>
    <div class="sheet-head">
      <button class="txt-btn cancel" type="button" data-close="accScrim">Cancel</button>
      <h2 id="accTitle">New Account</h2>
      <button class="txt-btn save" type="submit">Save</button>
    </div>
    <div class="seg" role="radiogroup" aria-label="Account type">
      <label><input type="radio" name="accType" value="bank" checked><span>Bank / e-wallet</span></label>
      <label><input type="radio" name="accType" value="asb"><span>ASB</span></label>
    </div>
    <div class="list">
      <div class="field">
        <label for="accName">Name</label>
        <input id="accName" type="text" list="bankList" maxlength="40" placeholder="e.g. Maybank" autocomplete="off">
        <datalist id="bankList">
          <option value="Maybank"><option value="CIMB"><option value="Bank Islam"><option value="RHB">
          <option value="Public Bank"><option value="Hong Leong"><option value="AmBank"><option value="BSN">
          <option value="Bank Rakyat"><option value="Affin Bank"><option value="GXBank"><option value="Touch 'n Go eWallet">
          <option value="ASB"><option value="ASB 2">
        </datalist>
      </div>
      <div class="field"><label for="accBal" id="lblBal">Balance (RM)</label><input id="accBal" type="text" inputmode="decimal" placeholder="0.00" autocomplete="off"></div>
    </div>
    <div class="err" id="accErr" role="alert"></div>
    <div class="list" id="accDeleteWrap" hidden>
      <button class="row destroy" id="accDelete" type="button">Delete Account</button>
    </div>
  </form>
</div>

<div class="toast" id="toast" hidden></div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const CATEGORIES = ['Food & drinks', 'Transport & fuel', 'Bills & utilities', 'Groceries', 'Rent / loan', 'Shopping', 'Entertainment', 'Health', 'Other'];
  const OLD_CAT = { 'Makanan & minuman': 'Food & drinks', 'Pengangkutan & minyak': 'Transport & fuel', 'Bil & utiliti': 'Bills & utilities', 'Barang dapur': 'Groceries', 'Sewa / ansuran': 'Rent / loan', 'Belanja peribadi': 'Shopping', 'Hiburan': 'Entertainment', 'Kesihatan': 'Health', 'Lain-lain': 'Other' };
  const catName = (c) => OLD_CAT[c] || c || 'Other';
  const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  const rm = new Intl.NumberFormat('en-MY', { style: 'currency', currency: 'MYR' });
  const fmt = (sen) => rm.format((sen || 0) / 100);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
  const store = {
    get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  };
  const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 9);

  function toSen(text, allowNeg) {
    const t = String(text).replace(/[,\sRMrm]/g, '');
    if (!/^-?\d+(\.\d{0,2})?$/.test(t)) return null;
    const n = Math.round(parseFloat(t) * 100);
    if (!allowNeg && n < 0) return null;
    return n;
  }
  function today() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  }

  // ---------- Hide balances (remembered on this device) ----------
  let hidden = store.get('my-money-hide') === true;
  const EYE_OPEN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>';
  const EYE_SHUT = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10c2.4 3 5.4 4.5 9 4.5s6.6-1.5 9-4.5"/><path d="M6 13.2 4.5 15.5M12 14.5V17M18 13.2l1.5 2.3"/></svg>';
  const money = (sen) => hidden ? 'RM ••••' : fmt(sen);

  // ---------- Data: Claude storage with an offline queue ----------
  // Stored field names stay as before (akaun, transaksi, jumlah…) so existing data keeps working.
  const Q_KEY = 'my-money-queue', CACHE_KEY = 'my-money-cache', LOCAL_KEY = 'duit-saya-v1';
  let mode = 'loading';           // 'loading' | 'db' | 'local'
  let base = { akaun: [], transaksi: [] };   // last data from storage
  let queue = store.get(Q_KEY) || [];        // changes waiting to sync: {op, col, id, data}
  let cols = null, ready = false, loadSlow = false, flushing = false;

  function list(c) {
    let arr = base[c].slice();
    for (const q of queue) {
      if (q.col !== c) continue;
      if (q.op === 'set') { arr = arr.filter(x => x.id !== q.id); arr.push({ id: q.id, ...q.data, _pending: true }); }
      else if (q.op === 'update') arr = arr.map(x => x.id === q.id ? { ...x, ...q.data, _pending: true } : x);
      else if (q.op === 'delete') arr = arr.filter(x => x.id !== q.id);
    }
    return arr;
  }
  const A = () => list('akaun');
  const T = () => list('transaksi');

  function write(op, col, id, data) {
    if (mode === 'local') {
      if (op === 'set') base[col] = [...base[col].filter(x => x.id !== id), { id, ...data }];
      else if (op === 'update') base[col] = base[col].map(x => x.id === id ? { ...x, ...data } : x);
      else base[col] = base[col].filter(x => x.id !== id);
      store.set(LOCAL_KEY, base);
    } else {
      queue.push({ op, col, id, data });
      store.set(Q_KEY, queue);
      flush();
    }
    render();
  }

  const withTimeout = (p, ms) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej({ code: 'timeout' }), ms))]);
  async function flush() {
    if (flushing || mode !== 'db' || !cols || !navigator.onLine) { render(); return; }
    flushing = true; render();
    while (queue.length) {
      const q = queue[0];
      const ref = cols[q.col].doc(q.id);
      try {
        // Each change uses a fixed id, so sending it again after a timeout is safe.
        await withTimeout(q.op === 'set' ? ref.set(q.data) : q.op === 'update' ? ref.update(q.data) : ref.delete(), 12000);
        queue.shift(); store.set(Q_KEY, queue);
      } catch (e) {
        if (e && (e.code === 'invalid_argument' || e.code === 'quota_exceeded')) {
          queue.shift(); store.set(Q_KEY, queue);
          toast(e.code === 'quota_exceeded' ? 'Storage is full. Delete old transactions to add new ones.' : "One change couldn't be saved and was skipped.");
        } else break;   // offline or slow: keep it and try again later
      }
    }
    flushing = false; render();
  }
  window.addEventListener('online', flush);
  window.addEventListener('offline', render);
  setInterval(() => { if (queue.length) flush(); }, 20000);

  function setupDb(db, uid) {
    const root = db.doc(`data/users/${uid}/kewangan`);
    cols = { akaun: root.collection('akaun'), transaksi: root.collection('transaksi') };
    const cached = store.get(CACHE_KEY);
    if (cached && cached.uid === uid) base = { akaun: cached.akaun || [], transaksi: cached.transaksi || [] };
    const got = { akaun: false, transaksi: false };
    const timer = setTimeout(() => { if (!ready) { loadSlow = true; render(); } }, 10000);
    for (const name of ['akaun', 'transaksi']) {
      cols[name].onSnapshot((snap) => {
        base[name] = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        if (!snap.metadata.fromCache) got[name] = true;
        if (got.akaun && got.transaksi) {
          if (!ready) { ready = true; loadSlow = false; clearTimeout(timer); flush(); }
          store.set(CACHE_KEY, { uid, ...base });
        }
        render();
      }, () => { clearTimeout(timer); loadSlow = true; render(); });
    }
  }

  async function init() {
    render();
    let db = null, user = null;
    try {
      if (window.claude && typeof window.claude.use === 'function') {
        [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
      }
    } catch (e) {}
    let uid = null;
    try { uid = user ? await user.id() : null; } catch (e) {}
    if (db && uid) { mode = 'db'; setupDb(db, uid); }
    else {
      mode = 'local';
      const d = store.get(LOCAL_KEY);
      if (d && Array.isArray(d.akaun)) base = { akaun: d.akaun, transaksi: d.transaksi || [] };
    }
    render();
  }

  // ---------- Small UI helpers ----------
  let toastTimer;
  function toast(text) {
    const t = $('toast'); t.textContent = text; t.hidden = false;
    clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 2200);
  }
  function statusLine() {
    const s = $('status');
    let text = '', warn = false;
    if (mode === 'local') text = window.claude ? 'Saved on this device only. Sign in to claude.ai to sync across devices.' : 'Saved on this device only. Clearing browser data will remove it.';
    else if (queue.length && !navigator.onLine) { text = `Offline · ${queue.length} change${queue.length > 1 ? 's' : ''} will sync when you're back online`; warn = true; }
    else if (queue.length) { text = `Syncing ${queue.length} change${queue.length > 1 ? 's' : ''}…`; warn = true; }
    else if (!navigator.onLine) { text = "Offline · you can keep adding, it'll sync later"; warn = true; }
    else if (loadSlow) { text = "Can't reach your data right now. Showing the last saved copy."; warn = true; }
    s.hidden = !text; s.className = 'status' + (warn ? ' warn' : '');
    s.innerHTML = text ? `<i aria-hidden="true"></i>${esc(text)}` : '';
  }

  // ---------- Calculations ----------
  function net(accId, txs) {
    let n = 0;
    for (const t of txs) {
      const j = t.jumlah || 0;
      if (t.jenis === 'belanja' && t.akaunId === accId) n -= j;
      else if (t.jenis === 'masuk' && t.akaunId === accId) n += j;
      else if (t.jenis === 'pindah') { if (t.dariId === accId) n -= j; if (t.keId === accId) n += j; }
    }
    return n;
  }

  // ---------- Render ----------
  const ui = { month: today().slice(0, 7), confirmTx: null, activeCat: null };
  function render() {
    const accounts = A().sort((a, b) => (a.jenis === b.jenis ? (a.dicipta || 0) - (b.dicipta || 0) : a.jenis === 'asb' ? 1 : -1));
    const txs = T();
    const accName = (id) => (accounts.find(a => a.id === id) || {}).nama || 'Deleted account';
    const bal = (a) => (a.bakiAwal || 0) + net(a.id, txs);
    statusLine();

    // Hero
    $('eye').innerHTML = hidden ? EYE_SHUT : EYE_OPEN;
    $('eye').setAttribute('aria-label', hidden ? 'Show balances' : 'Hide balances');
    $('eye').setAttribute('aria-pressed', String(hidden));
    let bank = 0, asb = 0;
    for (const a of accounts) { if (a.jenis === 'asb') asb += bal(a); else bank += bal(a); }
    $('sTotal').textContent = money(bank + asb);
    $('sBank').textContent = money(bank);
    $('sAsb').textContent = money(asb);

    // Accounts
    const loading = mode === 'loading' || (mode === 'db' && !ready && !base.akaun.length && !loadSlow);
    if (loading) $('accountList').innerHTML = '<div class="empty">Loading accounts…</div>';
    else {
      const rows = accounts.map(a => {
        const b = bal(a);
        const ini = esc(a.nama.replace(/[^A-Za-z0-9 ]/g, '').split(/\s+/).filter(Boolean).map(w => w[0]).join('').slice(0, 2).toUpperCase() || '•');
        return `<button type="button" class="row" data-acc="${esc(a.id)}">
          <span class="badge ${a.jenis === 'asb' ? 'asb' : ''}" aria-hidden="true">${ini}</span>
          <span class="main"><strong>${esc(a.nama)}</strong><small>${a.jenis === 'asb' ? 'Investment' : 'Bank / e-wallet'}${a._pending ? ' · waiting to sync' : ''}</small></span>
          <span class="end num ${b < 0 && !hidden ? 'neg' : ''}">${money(b)}</span><span class="chev" aria-hidden="true">›</span></button>`;
      }).join('');
      const empty = accounts.length ? '' : '<div class="empty">Add each bank with its current balance, and an ASB account to track savings.</div>';
      $('accountList').innerHTML = empty + rows + '<button type="button" class="row link" id="addAccountRow">Add Account</button>';
    }

    // Month
    const [y, m] = ui.month.split('-').map(Number);
    const nowKey = today().slice(0, 7);
    const thisMonth = ui.month === nowKey;
    $('monthLabel').textContent = thisMonth ? 'This Month' : `${MONTHS[m - 1]} ${y}`;
    $('nextMonth').disabled = ui.month >= nowKey;
    const asbIds = new Set(accounts.filter(a => a.jenis === 'asb').map(a => a.id));
    const monthTx = txs.filter(t => (t.tarikh || '').startsWith(ui.month));
    let spent = 0, income = 0, saved = 0;
    for (const t of monthTx) {
      if (t.jenis === 'belanja') spent += t.jumlah;
      if (t.jenis === 'masuk') { income += t.jumlah; if (asbIds.has(t.akaunId)) saved += t.jumlah; }
      if (t.jenis === 'pindah' && asbIds.has(t.keId) && !asbIds.has(t.dariId)) saved += t.jumlah;
    }
    $('sSpent').textContent = fmt(spent);
    $('sIncome').textContent = fmt(income);
    $('sSaved').textContent = fmt(saved);

    renderDonut(monthTx, spent, thisMonth, m);

    // Transactions
    const sorted = [...monthTx].sort((a, b) => (b.tarikh || '').localeCompare(a.tarikh || '') || (b.dicipta || 0) - (a.dicipta || 0));
    $('txList').innerHTML = sorted.length ? sorted.map(t => {
      const [, tm, td] = (t.tarikh || '').split('-');
      const date = td ? `${Number(td)} ${MONTHS[Number(tm) - 1].slice(0, 3)}` : '';
      let title, detail, sign;
      if (t.jenis === 'pindah') { title = t.nota || 'Transfer'; detail = `${accName(t.dariId)} → ${accName(t.keId)}`; sign = ''; }
      else if (t.jenis === 'masuk') { title = t.nota || 'Income'; detail = accName(t.akaunId); sign = '+'; }
      else { title = t.nota || catName(t.kategori); detail = `${t.nota ? catName(t.kategori) + ' · ' : ''}${accName(t.akaunId)}`; sign = '−'; }
      const open = ui.confirmTx === t.id;
      return `<div class="row tx" data-tx="${esc(t.id)}" role="button" tabindex="0" aria-expanded="${open}">
        <span class="main"><strong>${esc(title)}</strong><small>${esc(date)} · ${esc(detail)}${t._pending ? ' · <span class="wait">waiting to sync</span>' : ''}</small></span>
        ${open ? `<button type="button" class="del" data-del="${esc(t.id)}">Delete</button>` : `<span class="end num ${t.jenis}">${sign}${fmt(t.jumlah)}</span>`}</div>`;
    }).join('') : `<div class="empty">${loading ? 'Loading…' : 'No transactions yet. Tap Add Transaction to record one.'}</div>`;

    // Form account choices
    const opts = accounts.map(a => `<option value="${esc(a.id)}">${esc(a.nama)}</option>`).join('');
    for (const sel of [$('txAccount'), $('txTo')]) {
      const prev = sel.value;
      sel.innerHTML = opts || '<option value="">Add an account first</option>';
      if (accounts.some(a => a.id === prev)) sel.value = prev;
    }
    if ($('txTo').value === $('txAccount').value && accounts.length > 1) {
      const other = accounts.find(a => a.jenis === 'asb' && a.id !== $('txAccount').value) || accounts.find(a => a.id !== $('txAccount').value);
      $('txTo').value = other.id;
    }
    $('fab').disabled = loading;
  }

  // ---------- Donut ----------
  const catColour = (k) => { const i = CATEGORIES.indexOf(k); return i >= 0 && i < 8 ? `var(--c${i + 1})` : 'var(--c-other)'; };
  function renderDonut(monthTx, spent, thisMonth, m) {
    const byCat = {};
    for (const t of monthTx) if (t.jenis === 'belanja') { const k = catName(t.kategori); byCat[k] = (byCat[k] || 0) + t.jumlah; }
    const cats = Object.entries(byCat).sort((a, b) => b[1] - a[1]);
    if (ui.activeCat && !byCat[ui.activeCat]) ui.activeCat = null;
    const R = 80, C = 2 * Math.PI * R, GAP = cats.length > 1 ? 2 : 0;
    let off = 0, segs = '';
    for (const [k, v] of cats) {
      const len = v / spent * C, draw = Math.max(len - GAP, 0.5);
      const cls = ui.activeCat ? (ui.activeCat === k ? 'seg on' : 'seg dim') : 'seg';
      segs += `<circle class="${cls}" data-cat="${esc(k)}" cx="100" cy="100" r="${R}" stroke="${catColour(k)}" stroke-dasharray="${draw} ${C - draw}" stroke-dashoffset="${-off}"><title>${esc(k)}: ${fmt(v)}</title></circle>`;
      off += len;
    }
    $('donutSvg').innerHTML = `<circle class="track" cx="100" cy="100" r="${R}"></circle>${segs}`;
    if (ui.activeCat) {
      const v = byCat[ui.activeCat];
      $('donutCentre').innerHTML = `<small>${esc(ui.activeCat)}</small><strong class="num">${fmt(v)}</strong><span>${Math.round(v / spent * 100)}% of spending</span>`;
    } else {
      $('donutCentre').innerHTML = `<small>${thisMonth ? "This month's spending" : `Spending in ${MONTHS[m - 1]}`}</small><strong class="num">${fmt(spent)}</strong>`;
    }
    $('catList').innerHTML = cats.length
      ? cats.map(([k, v]) => `<button type="button" class="row ${ui.activeCat === k ? 'on' : ''}" data-cat="${esc(k)}">
          <i style="background:${catColour(k)}"></i><span class="main">${esc(k)}</span><span class="end num">${fmt(v)}</span><span class="pct num">${Math.round(v / spent * 100)}%</span></button>`).join('')
      : '<div class="empty">No spending recorded for this month.</div>';
  }
  function pickCat(e) {
    const el = e.target.closest('[data-cat]'); if (!el) return;
    ui.activeCat = ui.activeCat === el.dataset.cat ? null : el.dataset.cat;
    render();
  }
  $('donutSvg').addEventListener('click', pickCat);
  $('catList').addEventListener('click', pickCat);

  // ---------- Events ----------
  $('eye').addEventListener('click', () => { hidden = !hidden; store.set('my-money-hide', hidden); render(); });
  function shiftMonth(step) {
    const [y, m] = ui.month.split('-').map(Number);
    const d = new Date(y, m - 1 + step, 1);
    ui.month = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
    ui.confirmTx = null; ui.activeCat = null;
    render();
  }
  $('prevMonth').addEventListener('click', () => shiftMonth(-1));
  $('nextMonth').addEventListener('click', () => shiftMonth(1));

  // Transaction row: tap to show Delete, tap Delete to remove
  function onTx(e) {
    const del = e.target.closest('[data-del]');
    if (del) { const t = T().find(x => x.id === del.dataset.del); ui.confirmTx = null; write('delete', 'transaksi', del.dataset.del); toast(t ? 'Transaction deleted' : 'Deleted'); return; }
    const row = e.target.closest('[data-tx]'); if (!row) return;
    ui.confirmTx = ui.confirmTx === row.dataset.tx ? null : row.dataset.tx;
    render();
  }
  $('txList').addEventListener('click', onTx);
  $('txList').addEventListener('keydown', (e) => { if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[data-tx]')) { e.preventDefault(); onTx(e); } });

  // Sheets
  function openSheet(id, focusId) { $(id).hidden = false; if (focusId) setTimeout(() => $(focusId).focus(), 60); }
  function closeSheet(id) { $(id).hidden = true; }
  document.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', () => closeSheet(b.dataset.close)));
  document.querySelectorAll('.scrim').forEach(s => s.addEventListener('click', (e) => { if (e.target === s) closeSheet(s.id); }));
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') document.querySelectorAll('.scrim:not([hidden])').forEach(s => closeSheet(s.id)); });

  // ---------- Transaction sheet ----------
  const txType = () => document.querySelector('input[name="txType"]:checked').value;
  function updateForm() {
    const t = txType();
    $('fieldTo').hidden = t !== 'pindah';
    $('fieldCat').hidden = t !== 'belanja';
    $('lblAccount').textContent = t === 'masuk' ? 'To' : 'From';
    $('txNote').placeholder = t === 'belanja' ? 'e.g. lunch' : t === 'masuk' ? 'e.g. salary' : 'e.g. monthly ASB';
    $('txErr').textContent = '';
  }
  $('txCat').innerHTML = CATEGORIES.map(c => `<option>${esc(c)}</option>`).join('');
  document.querySelectorAll('input[name="txType"]').forEach(r => r.addEventListener('change', updateForm));
  function openTx() {
    if (!A().length) { openAccount(null); toast('Add an account first'); return; }
    $('txAmount').value = ''; $('txNote').value = ''; $('txDate').value = today(); $('txErr').textContent = '';
    openSheet('txScrim', 'txAmount');
  }
  $('fab').addEventListener('click', openTx);
  $('headerAdd').addEventListener('click', openTx);

  $('txForm').addEventListener('submit', (e) => {
    e.preventDefault();
    if (mode === 'loading') return;
    const t = txType(), amount = toSen($('txAmount').value), err = $('txErr');
    if (!amount) { err.textContent = 'Enter an amount above RM0, for example 12.50.'; $('txAmount').focus(); return; }
    if (!$('txAccount').value) { err.textContent = 'Add an account first.'; return; }
    if (!$('txDate').value) { err.textContent = 'Pick a date.'; return; }
    const data = { jenis: t, jumlah: amount, tarikh: $('txDate').value, nota: $('txNote').value.trim(), dicipta: Date.now() };
    if (t === 'pindah') {
      if ($('txAccount').value === $('txTo').value) { err.textContent = 'Choose two different accounts.'; return; }
      data.dariId = $('txAccount').value; data.keId = $('txTo').value;
    } else {
      data.akaunId = $('txAccount').value;
      if (t === 'belanja') data.kategori = $('txCat').value;
    }
    ui.month = data.tarikh.slice(0, 7);
    write('set', 'transaksi', newId(), data);
    closeSheet('txScrim');
    toast(t === 'belanja' ? 'Expense saved' : t === 'masuk' ? 'Income saved' : 'Transfer saved');
  });

  // ---------- Account sheet ----------
  let editing = null, confirmDel = false;
  function openAccount(id, type) {
    editing = id ? A().find(a => a.id === id) : null;
    confirmDel = false;
    const txs = T();
    $('accTitle').textContent = editing ? 'Edit Account' : 'New Account';
    const kind = editing ? editing.jenis : (type || 'bank');
    document.querySelector(`input[name="accType"][value="${kind}"]`).checked = true;
    $('accName').value = editing ? editing.nama : '';
    $('accBal').value = editing ? (((editing.bakiAwal || 0) + net(editing.id, txs)) / 100).toFixed(2) : '';
    $('lblBal').textContent = editing ? 'Actual balance' : 'Balance (RM)';
    $('accDeleteWrap').hidden = !editing;
    $('accDelete').textContent = 'Delete Account';
    $('accErr').textContent = '';
    openSheet('accScrim', editing ? null : 'accName');
  }
  $('accountList').addEventListener('click', (e) => {
    const a = e.target.closest('[data-acc]'); if (a) return openAccount(a.dataset.acc);
    if (e.target.closest('#addAccountRow')) openAccount(null);
  });
  document.querySelectorAll('input[name="accType"]').forEach(r => r.addEventListener('change', () => {
    if (!editing && r.checked && r.value === 'asb' && !$('accName').value) $('accName').value = 'ASB';
  }));

  $('accountForm').addEventListener('submit', (e) => {
    e.preventDefault();
    if (mode === 'loading') return;
    const name = $('accName').value.trim();
    const type = document.querySelector('input[name="accType"]:checked').value;
    const sen = $('accBal').value.trim() === '' ? 0 : toSen($('accBal').value, true);
    if (!name) { $('accErr').textContent = 'Enter a name, for example Maybank.'; return; }
    if (sen === null) { $('accErr').textContent = 'Use a number like 1500 or 1500.50.'; return; }
    if (editing) {
      // Adjust the starting balance so the calculated balance matches the real one entered
      write('update', 'akaun', editing.id, { nama: name, jenis: type, bakiAwal: sen - net(editing.id, T()) });
      toast('Account updated');
    } else {
      write('set', 'akaun', newId(), { nama: name, jenis: type, bakiAwal: sen, dicipta: Date.now() });
      toast(`${name} added`);
    }
    closeSheet('accScrim');
  });

  $('accDelete').addEventListener('click', () => {
    if (!editing) return;
    const linked = T().filter(t => t.akaunId === editing.id || t.dariId === editing.id || t.keId === editing.id);
    if (!confirmDel) {
      confirmDel = true;
      $('accDelete').textContent = linked.length ? `Tap again to delete with ${linked.length} transaction${linked.length > 1 ? 's' : ''}` : 'Tap again to delete';
      return;
    }
    for (const t of linked) write('delete', 'transaksi', t.id);
    write('delete', 'akaun', editing.id);
    toast(`${editing.nama} deleted`);
    closeSheet('accScrim');
  });

  updateForm();
  init();
})();
</script>

</body>
</html>
